[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-explainability-fairness"
version = "0.1.0"
description = "Churn prediction with XGBoost, SHAP, and Fairlearn"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<4", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "xgboost>=2.0,<4", "shap>=0.45,<1", "fairlearn>=0.10,<1", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "py7zr>=1.0,<2"]

[project.scripts]
churn-audit = "churn_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
